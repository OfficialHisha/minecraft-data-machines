  omni_assembler:
    machine_name: "Omni Assembler"
    supported_recipe_types: ["smelting", "crushing", "mixing", "sorting"]
    input_slots: [0]
    output_slots: [1, 2]
    modifiers:
      per_type:
        mixing: 5.0
        smelting: 2.0
        crushing: 2.0
        sorting: 2.0
    properties:
      stop_on_full_buffer: false
      allow_pushing: false
      redstone_required: "off"
      fuel_required: false
    progress_slot: 8
    progress_elements:
      0: "0"
      10: "10"
      25: "25"
      50: "50"
      75: "75"
      90: "90"
