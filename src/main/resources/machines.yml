    progress_slot: 8
    progress_elements:
      0: "0"
      10: "10"
      25: "25"
      50: "50"
      75: "75"
      90: "90"

  chemical_mixer:
    machine_name: "Chemical Mixer"
    supported_recipe_types: ["mixing"]
    input_slots: [0, 1]
    output_slots: [2]
    fuel_slots: [3]
    modifiers: 0.5
    properties:
      stop_on_full_buffer: true
      allow_pushing: false
      redstone_required: "disabled"
      fuel_required: true
      fuel_items:
        coal: 1600
    progress_slot: 8
    progress_elements:
      0: "0"
      10: "10"
      25: "25"
      50: "50"
      75: "75"
      90: "90"
    fuel_progress_slot: 7
    fuel_progress_elements:
