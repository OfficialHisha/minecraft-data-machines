  auto_sorter:
    machine_name: "Auto Sorter"
    supported_recipe_types: ["sorting"]
    input_slots: [0]
    output_slots: [1, 2]
    modifiers: 1.0
    properties:
      stop_on_full_buffer: true
      allow_pushing: true
      redstone_required: "on"
      fuel_required: false
