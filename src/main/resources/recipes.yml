recipes:
  iron_ingot_from_ore:
    type: "smelting"
    inputs:
      - { item: "iron_ore", amount: 1 }
    outputs:
      - { item: "iron_ingot", amount: 1, chance: 1.0 }
    processing_time: 200

  copper_dust_from_ore:
    type: "crushing"
    inputs:
      - { item: "copper_ore", amount: 1 }
    outputs:
      - { item: "raw_copper", amount: 2, chance: 1.0 }
      - { item: "copper_nugget", amount: 1, chance: 0.5 }
    processing_time: 100

  sort_cobblestone:
    type: "sorting"
    inputs:
      - { item: "cobblestone", amount: 1 }
    outputs:
      - { item: "cobblestone", amount: 1, chance: 0.9 }
      - { item: "diamond", amount: 1, chance: 0.5 }
    processing_time: 1

  steel_alloy:
    type: "mixing"
    inputs:
      - { item: "nexo:iron_dust", amount: 2 }
      - { item: "nexo:carbon_dust", amount: 1 }
    outputs:
      - { item: "nexo:steel_ingot", amount: 3, chance: 1.0 }
    processing_time: 500